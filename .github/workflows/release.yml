name: Trigger TestFlight Build on Release

# Triggered by a repository_dispatch from checkout-ios-sdk/tag-release.yml
# immediately after the dist-repo draft release is flipped to published.
# workflow_dispatch is kept as a manual fallback (e.g. re-running a missed
# TestFlight build or recovering from a dispatch failure without re-running
# the full source-side release pipeline).
on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Package repo tag (e.g. 1.3.8 or 1.3.8-rc.0, no v prefix)"
        required: true
      is_prerelease:
        description: "true for RC pre-release, false for stable"
        required: true
        default: "false"

concurrency:
  group: release-package
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-sdk-tag:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout SDK repository
        uses: actions/checkout@v5
        with:
          repository: spreedly/checkout-ios-sdk
          token: ${{ secrets.SDK_REPO_TOKEN }}
          fetch-depth: 0

      - name: Configure git for private package access
        run: |
          git config --global url."https://x-access-token:${{ secrets.SDK_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Environment diagnostics
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.tag_name || github.event.inputs.tag_name }}
        run: |
          echo "=== Release Info ==="
          echo "Release version: ${RELEASE_VERSION}"
          echo "Triggered by:    ${{ github.actor }}"
          echo ""
          echo "=== Xcode ==="
          xcode-select -p
          xcodebuild -version
          swift --version
          echo ""
          echo "=== System ==="
          echo "macOS: $(sw_vers -productVersion)"
          echo "Disk free: $(df -h / | tail -1 | awk '{print $4}')"
          echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "=== Git ==="
          echo "SDK branch: $(git branch --show-current)"
          echo "SDK HEAD:   $(git rev-parse --short HEAD)"

      - name: Cache Swift Package Manager
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-release-${{ runner.os }}-${{ runner.arch }}-
            spm-release-${{ runner.os }}-

      - name: SPM cache diagnostics
        run: |
          CACHE_DIR=~/Library/Caches/org.swift.swiftpm
          if [ -d "$CACHE_DIR" ]; then
            CACHE_SIZE=$(du -sh "$CACHE_DIR" 2>/dev/null | awk '{print $1}')
            CACHE_COUNT=$(find "$CACHE_DIR" -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "SPM cache: $CACHE_SIZE ($CACHE_COUNT files)"
          else
            echo "SPM cache: EMPTY (cold start -- expect slow resolve)"
          fi

      - name: Pin project.pbxproj SPM requirement for RC pre-release
        if: ${{ github.event.client_payload.is_prerelease == 'true' || github.event.inputs.is_prerelease == 'true' }}
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.tag_name || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail

          PBXPROJ="Example/SpreedlySDKExample/SpreedlySDKExample.xcodeproj/project.pbxproj"
          export PBXPROJ

          echo "=== RC pre-release: pin checkout-ios-package to exactVersion ${RELEASE_VERSION} in project.pbxproj ==="

          # upToNextMajorVersion excludes pre-releases by SPM spec, so SPM silently
          # downgrades back to the latest stable during resolve. Switching to exactVersion
          # for the duration of this workflow run forces SPM to fetch the RC.
          # This edit only lands on the testflight-rc-* tag commit; main is never pushed.
          python3 << 'PYEOF'
          import re, sys, os

          version = os.environ['RELEASE_VERSION']
          pbxproj = os.environ['PBXPROJ']

          with open(pbxproj) as f:
              content = f.read()

          anchor = 'repositoryURL = "https://github.com/spreedly/checkout-ios-package";\n'
          idx = content.find(anchor)
          if idx == -1:
              print('ERROR: checkout-ios-package repositoryURL not found in project.pbxproj')
              sys.exit(1)

          after = content[idx + len(anchor):]
          m = re.search(r'(\t+)requirement = \{[^}]+\};', after)
          if not m:
              print('ERROR: requirement block not found after repositoryURL anchor')
              sys.exit(1)

          indent = m.group(1)
          inner = indent + '\t'
          replacement = (
              f'{indent}requirement = {{\n'
              f'{inner}kind = exactVersion;\n'
              f'{inner}version = {version};\n'
              f'{indent}}};'
          )
          new_content = content[:idx + len(anchor)] + replacement + after[m.end():]

          with open(pbxproj, 'w') as f:
              f.write(new_content)

          print(f'Patched project.pbxproj: checkout-ios-package SPM requirement set to exactVersion {version}')
          PYEOF

      - name: Update Package.resolved to released version
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.tag_name || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail

          RESOLVED_FILE="Example/SpreedlySDKExample/SpreedlySDKExample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          echo "=== Step 1: Validate Package.resolved exists ==="
          if [ ! -f "$RESOLVED_FILE" ]; then
            echo "FATAL: Package.resolved not found at $RESOLVED_FILE"
            echo "Working directory: $(pwd)"
            echo "Listing Example/ directory:"
            find Example -name "Package.resolved" -type f 2>/dev/null || echo "No Package.resolved found anywhere in Example/"
            exit 1
          fi
          echo "Found: $RESOLVED_FILE ($(wc -c < "$RESOLVED_FILE") bytes)"

          echo ""
          echo "=== Step 2: Show Package.resolved BEFORE update ==="
          echo "Current checkout-ios-package pin:"
          python3 -c "
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          for pin in data.get('pins', []):
              if pin['identity'] == 'checkout-ios-package':
                  print(f'  version:  {pin[\"state\"].get(\"version\", \"unknown\")}')
                  print(f'  revision: {pin[\"state\"].get(\"revision\", \"unknown\")}')
                  break
          else:
              print('  NOT FOUND in Package.resolved')
          print(f'Total pins: {len(data.get(\"pins\", []))}')
          print('All packages:')
          for pin in data.get('pins', []):
              v = pin['state'].get('version', 'unknown')
              print(f'  - {pin[\"identity\"]} @ {v}')
          " "$RESOLVED_FILE"

          echo ""
          echo "=== Step 3: Update version to $RELEASE_VERSION ==="
          python3 -c "
          import json, sys

          version = sys.argv[1]
          path = sys.argv[2]

          with open(path) as f:
              data = json.load(f)

          for pin in data.get('pins', []):
              if pin['identity'] == 'checkout-ios-package':
                  old = pin['state'].get('version', 'unknown')
                  pin['state']['version'] = version
                  print(f'Updated checkout-ios-package: {old} -> {version}')
                  break
          else:
              print('ERROR: checkout-ios-package not found in Package.resolved')
              sys.exit(1)

          data.pop('originHash', None)

          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          " "$RELEASE_VERSION" "$RESOLVED_FILE"

          echo ""
          echo "=== Step 4: Resolve SPM dependencies ==="
          cd Example/SpreedlySDKExample

          START=$(date +%s)

          xcodebuild -resolvePackageDependencies \
              -project SpreedlySDKExample.xcodeproj \
              -scheme SpreedlySDKExample &
          XCODE_PID=$!

          while kill -0 $XCODE_PID 2>/dev/null; do
            sleep 30
            ELAPSED=$(( $(date +%s) - START ))
            echo "   [${ELAPSED}s] Still resolving... (pid $XCODE_PID)"
          done

          XCODE_EXIT=0
          wait $XCODE_PID || XCODE_EXIT=$?
          DURATION=$(( $(date +%s) - START ))

          if [ $XCODE_EXIT -eq 0 ]; then
            echo "Dependencies resolved successfully (${DURATION}s)"
          else
            echo "FATAL: xcodebuild -resolvePackageDependencies failed (exit $XCODE_EXIT, ${DURATION}s)"
            exit 1
          fi

          echo ""
          echo "=== Step 5: Show Package.resolved AFTER resolve ==="
          python3 -c "
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          print(f'Total pins: {len(data.get(\"pins\", []))}')
          print(f'originHash: {data.get(\"originHash\", \"MISSING\")}')
          print('All packages:')
          for pin in data.get('pins', []):
              v = pin['state'].get('version', 'unknown')
              r = pin['state'].get('revision', 'unknown')[:7]
              print(f'  - {pin[\"identity\"]} @ {v} ({r})')
          " "../../$RESOLVED_FILE"

      - name: Verify resolved version matches release
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.tag_name || github.event.inputs.tag_name }}
        run: |
          set -euo pipefail

          RESOLVED_FILE="Example/SpreedlySDKExample/SpreedlySDKExample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          echo "=== Step 6: Guard — verify Package.resolved pins checkout-ios-package @ ${RELEASE_VERSION} ==="

          RESOLVED_VERSION=$(python3 -c "
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          for pin in data.get('pins', []):
              if pin['identity'] == 'checkout-ios-package':
                  print(pin['state'].get('version', 'unknown'))
                  break
          else:
              print('::error::checkout-ios-package not found in Package.resolved pins', file=sys.stderr)
              sys.exit(1)
          " "$RESOLVED_FILE")

          echo "Expected: ${RELEASE_VERSION}"
          echo "Resolved: ${RESOLVED_VERSION}"

          if [ "$RESOLVED_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::Silent drift detected: requested ${RELEASE_VERSION} but SPM resolved to ${RESOLVED_VERSION}."
            echo "::error::For RC pre-releases the project.pbxproj exact-pin step should have run. Check the 'Pin project.pbxproj' step above."
            exit 1
          fi

          echo "Verified: Package.resolved correctly pins checkout-ios-package @ ${RELEASE_VERSION}"

      - name: Create TestFlight tag with updated Package.resolved
        if: ${{ !contains(github.event.client_payload.tag_name || github.event.inputs.tag_name || '', '-dev.') }}
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.tag_name || github.event.inputs.tag_name }}
          IS_PRERELEASE: ${{ github.event.client_payload.is_prerelease || github.event.inputs.is_prerelease }}
        run: |
          set -euo pipefail

          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          RESOLVED_FILE="Example/SpreedlySDKExample/SpreedlySDKExample.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"

          # Distinct tag prefix for RC vs stable so Xcode Cloud start conditions can
          # match unambiguously without regex tricks: stable builds trigger on
          # testflight-* and ship to the regular tester group; RC builds trigger on
          # testflight-rc-* and ship to a dedicated RC-only group for QA real-device
          # validation BEFORE the stable promotion.
          # github.event.release.prerelease comes straight from the release payload
          # the publishing repo (checkout-ios-sdk) sets on the GH Release; no
          # secondary version-string parsing needed.
          if [ "$IS_PRERELEASE" = "true" ]; then
            TAG_NAME="testflight-rc-${RELEASE_VERSION}"
            BUILD_LABEL="RC TestFlight build"
          else
            TAG_NAME="testflight-${RELEASE_VERSION}"
            BUILD_LABEL="TestFlight build"
          fi

          echo "Release event: ${RELEASE_VERSION} (prerelease=${IS_PRERELEASE})"
          echo "Target TestFlight tag: ${TAG_NAME}"

          PBXPROJ_FILE="Example/SpreedlySDKExample/SpreedlySDKExample.xcodeproj/project.pbxproj"

          echo "=== Committing updated lockfiles ==="
          git add "$RESOLVED_FILE"
          if [ "$IS_PRERELEASE" = "true" ]; then
            git add "$PBXPROJ_FILE"
            COMMIT_MSG="Update Package.resolved and pin project.pbxproj to checkout-ios-package ${RELEASE_VERSION}"
          else
            COMMIT_MSG="Update Package.resolved to checkout-ios-package ${RELEASE_VERSION}"
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit (files already up to date)"
          else
            git commit -m "$COMMIT_MSG"
            echo "Committed: $COMMIT_MSG"
          fi

          echo ""
          echo "=== Creating tag: $TAG_NAME ==="
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists, skipping creation"
          else
            git tag -a "$TAG_NAME" -m "${BUILD_LABEL} for checkout-ios-package ${RELEASE_VERSION}"
            echo "Pushing tag $TAG_NAME to origin..."
            if git push origin "$TAG_NAME"; then
              echo "Tag $TAG_NAME created and pushed successfully"
            else
              echo "FATAL: Failed to push tag $TAG_NAME"
              echo "Check that SDK_REPO_TOKEN has push access to spreedly/checkout-ios-sdk"
              exit 1
            fi
          fi
